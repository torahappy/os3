image: node:lts

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo

default:
  cache:
    # Remember to update binary version number after changing C/C++ library versions or their build scripts (setup_*.sh)
    key: ${CI_COMMIT_REF_SLUG}@1
    paths:
      - .cargo/
      - .emsdk/
      - os3bevy/target/
      - os3yew/target/
      - external-apps/

build:
  pages:
    publish: public
  rules:
    - if: $CI_COMMIT_REF_NAME == "main"
  before_script: []
  script:
    # [all] init
    - apt update
    - apt install -y cmake make autoconf automake g++ gcc m4 dc git-lfs meson 
    # [all] install emsdk & binaryen
    - if [ ! -d .emsdk ]; then git clone https://github.com/emscripten-core/emsdk .emsdk; fi
    - ./external-sources/setup-wasm.sh
    # [all] init public dir
    - mkdir public
    # [all] OCR: just copy the repo dir
    - cp -r ocr_web public/ocr_web
    # [all] install rustup, clang, wasm-bindgen
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - apt update
    - apt install -y clang
    - . "${CI_PROJECT_DIR}/.cargo/env"; cd os3bevy; rustup target add wasm32-unknown-unknown; cargo install -f wasm-bindgen-cli --version 0.2.129; cd ..
    # [rireki] build
    - . "${CI_PROJECT_DIR}/.cargo/env"; ./build_scripts/wasm-once.sh os3bevy rireki
    - mkdir public/rireki_web
    - cp ./os3bevy/wasm/rireki/rireki_bg.wasm public/rireki_web
    - cp ./os3bevy/wasm/rireki/*.html public/rireki_web
    - cp ./os3bevy/wasm/rireki/rireki.js public/rireki_web
    - cp -r ./os3bevy/assets public/rireki_web
    # [shimbun] build, only rust binaries (no TTS binaries)
    - . "${CI_PROJECT_DIR}/.cargo/env"; ./build_scripts/wasm-once.sh os3yew shimbun
    - mkdir public/shimbun_web
    - ./os3yew/install-wasm-binaries.sh
    - sed -i.bak s/PUT_COMMIT_ID_HERE/"${CI_COMMIT_SHA}"/ ./os3yew/wasm/shimbun/index.html
    - cd ./os3yew/wasm/shimbun; NODE_ENV=production yarn; cd ../../../
    - cp ./os3yew/wasm/shimbun/shimbun_bg.wasm public/shimbun_web
    - cp ./os3yew/wasm/shimbun/*.html public/shimbun_web
    - cp ./os3yew/wasm/shimbun/*.json public/shimbun_web
    - cp ./os3yew/wasm/shimbun/*.lock public/shimbun_web
    - cp ./os3yew/wasm/shimbun/*.js public/shimbun_web
    - cp -r ./os3yew/wasm/shimbun/snippets public/shimbun_web
    - cp -r ./os3yew/assets/shimbun public/shimbun_web/assets
    # [doomscroll] build, only frontend
    - . "${CI_PROJECT_DIR}/.cargo/env"; ./build_scripts/wasm-once.sh os3yew doomscroll
    - mkdir ./public/doomscroll_web
    - sed -i.bak s/PUT_COMMIT_ID_HERE/"${CI_COMMIT_SHA}"/ ./os3yew/wasm/doomscroll/index.html
    - cp -r ./os3yew/assets/doomscroll public/doomscroll_web/assets
    - cp ./os3yew/wasm/doomscroll/doomscroll_bg.wasm public/doomscroll_web
    - cp ./os3yew/wasm/doomscroll/*.html public/doomscroll_web
    - cp ./os3yew/wasm/doomscroll/*.css public/doomscroll_web
    - cp ./os3yew/wasm/doomscroll/*.js public/doomscroll_web
    # [rpg-helper] build
    - BUILD_NATIVE=0 BUILD_WASM=1 ./rpg-helper/setup-rpg.sh
    - cd rpg-helper; yarn install; yarn build; cd ..
    - mkdir -p public/0.0002-archive-rpg/
    - cd rpg-helper; cp -r dist-wasm games index.html index.js index.wasm lcf_worker.js server.js ZenKakuGothicAntique-Medium.ttf credentials.py *.server.js ../public/0.0002-archive-rpg/
  artifacts:
    expire_in: 1 hour
