[workspace]
members = [ "examples/captions", "examples/cubes", "examples/simple", "examples/skyvid"]

[workspace.package]
version = "0.7.0"
edition = "2024"

[workspace.dependencies]
bevy = { version = "0.19.1", default-features = false, features = [
    "bevy_core_pipeline",
    "bevy_log",
] }
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = [
    "Document",
    "EventTarget",
    "Window",
    "HtmlVideoElement",
    "HtmlMediaElement",
] }
crossbeam-channel = "0.5.17"

[package]
name = "bevy_web_video"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
webgpu = ["bevy/webgpu"]

[dependencies]
bevy = { workspace = true }
crossbeam-channel = { workspace = true }
gloo-events = "0.2.0"
js-sys = "=0.3.106"
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = "0.4.79"
web-sys = { workspace = true }
# Keep in sync with bevy
# https://github.com/bevyengine/bevy/issues/11079
wgpu-types = "29.0.4"
getrandom = {version = "0.3.4", features = ["wasm_js"]}

[profile.release]
opt-level = "s"
